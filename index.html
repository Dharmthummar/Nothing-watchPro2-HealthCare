<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D's Health — Live Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@600;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#070707; --panel:rgba(22,22,22,.72); --line:#272727; --line2:#333;
    --text:#F4F4F4; --dim:#8C8C8C; --red:#D71921; --red2:#FF3B3B; --white:#FFF; --green:#4CAF6E;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Space Grotesk',system-ui,sans-serif; min-height:100vh;
    background-image:
      radial-gradient(1200px 500px at 80% -10%, rgba(215,25,33,.07), transparent 60%),
      radial-gradient(circle, #171717 1px, transparent 1px);
    background-size:auto, 22px 22px;
  }
  .wrap{max-width:1140px;margin:0 auto;padding:0 20px 70px}

  /* Sticky glass header */
  header{
    position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;
    flex-wrap:wrap;gap:12px;padding:16px 0;margin-bottom:22px;
    background:rgba(7,7,7,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  h1{font-family:'Doto',monospace;font-weight:900;font-size:clamp(26px,5vw,42px);letter-spacing:2px;line-height:1}
  h1 .dot{color:var(--red)}
  .sub{color:var(--dim);font-size:11.5px;letter-spacing:1.8px;text-transform:uppercase;margin-top:4px}
  .hstat{display:flex;align-items:center;gap:14px}
  .status{font-size:11.5px;color:var(--dim);text-align:right;line-height:1.5}
  .status b{color:var(--text);font-weight:500}
  .live{display:inline-flex;align-items:center;gap:6px}
  .live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);
    box-shadow:0 0 8px var(--green);animation:pulse 2s infinite}
  .sync{background:var(--white);color:#000;border:none;border-radius:999px;padding:9px 20px;
    font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s}
  .sync:hover{background:var(--red);color:#fff;box-shadow:0 4px 24px rgba(215,25,33,.35)}
  .sync:disabled{opacity:.5;cursor:wait}
  @keyframes pulse{50%{opacity:.25}}

  /* Loading skeleton */
  #loading{padding:40px 0}
  #loading .big{font-family:'Doto',monospace;font-weight:600;font-size:19px;letter-spacing:2px;text-align:center;margin-bottom:8px}
  #loading .hint{color:var(--dim);font-size:13px;text-align:center;margin-bottom:30px}
  .pulse-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--red);margin-right:10px;animation:pulse 1s infinite}
  .skel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .skel div{height:110px;border-radius:16px;background:linear-gradient(100deg,#141414 40%,#1D1D1D 50%,#141414 60%);
    background-size:200% 100%;animation:shimmer 1.4s infinite}
  @keyframes shimmer{to{background-position:-200% 0}}

  /* Stat cards */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:16px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 16px;
    position:relative;overflow:hidden;backdrop-filter:blur(8px);
    transition:transform .2s, border-color .2s;
  }
  .card:hover{transform:translateY(-3px);border-color:var(--line2)}
  .card .label{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim)}
  .card .value{font-family:'Doto',monospace;font-weight:900;font-size:31px;margin-top:9px;line-height:1}
  .card .unit{font-size:12px;color:var(--dim);font-family:'Space Grotesk';font-weight:400;margin-left:4px}
  .card .delta{font-size:11.5px;margin-top:9px;color:var(--dim)}
  .card .delta.up{color:var(--green)}.card .delta.down{color:var(--red2)}
  .card::after{content:"";position:absolute;top:14px;right:14px;width:6px;height:6px;border-radius:50%;background:var(--red)}
  .card::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 60%,rgba(215,25,33,.05));pointer-events:none}

  /* AI insights */
  .panel.insights{margin-bottom:16px;border:1px solid #3a1113;
    background:linear-gradient(135deg, rgba(38,12,13,.85), rgba(20,20,20,.8))}
  .insights-body{font-size:14.5px;line-height:1.7;color:#DDD;white-space:pre-wrap}
  .insights-body strong{color:var(--white)}
  .regen{background:none;border:1px solid var(--line2);color:var(--dim);border-radius:50%;
    width:28px;height:28px;cursor:pointer;font-size:14px;margin-left:auto;transition:all .2s}
  .regen:hover{color:#fff;border-color:var(--red);transform:rotate(90deg)}
  .ai-badge{font-size:9.5px;background:var(--red);color:#fff;border-radius:4px;padding:2px 7px;
    letter-spacing:1px;font-weight:700}

  /* Segmented range control */
  .toolbar{display:flex;justify-content:flex-end;margin-bottom:14px}
  .ranges{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
  .ranges button{background:transparent;border:none;color:var(--dim);border-radius:999px;
    padding:6px 16px;font-family:inherit;font-size:12.5px;font-weight:500;cursor:pointer;transition:all .18s}
  .ranges button.active{background:var(--white);color:#000}
  .ranges button:focus-visible{outline:2px solid var(--red);outline-offset:2px}

  /* Chart panels */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
  /* ---- Mobile optimization ---- */
  @media(max-width:600px){
    .wrap{padding:0 12px 50px}
    header{position:sticky;padding:12px 0;gap:8px}
    h1{font-size:24px}
    .sub{font-size:9.5px;letter-spacing:1.2px;margin-top:2px}
    .hstat{gap:10px}
    .status{font-size:10px;max-width:150px}
    .sync{padding:8px 14px;font-size:12px}
    .cards{grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:12px}
    .card{padding:13px 12px;border-radius:13px}
    .card .label{font-size:9.5px;letter-spacing:1.2px}
    .card .value{font-size:23px;margin-top:7px}
    .card .unit{font-size:10.5px}
    .card .delta{font-size:10px;margin-top:6px}
    .card::after{top:10px;right:10px;width:5px;height:5px}
    .panel{padding:14px;border-radius:13px}
    .panel h2{font-size:10.5px;letter-spacing:1.3px;margin-bottom:10px;flex-wrap:wrap}
    .panel h2 .target{font-size:9.5px;width:100%;margin-left:16px;margin-top:2px}
    .panel .chartbox{height:185px}
    .insights-body{font-size:13.5px;line-height:1.6}
    .toolbar{justify-content:center}
    .ranges{width:100%;justify-content:space-between}
    .ranges button{flex:1;padding:7px 0;font-size:12px}
    footer{font-size:9.5px}
  }
  @media(max-width:380px){
    .cards{grid-template-columns:1fr 1fr}
    .card .value{font-size:20px}
  }
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;
    backdrop-filter:blur(8px);transition:border-color .2s}
  .panel:hover{border-color:var(--line2)}
  .panel h2{font-size:11.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--dim);
    font-weight:500;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .panel h2 .target{color:#FFD60A;font-weight:400;text-transform:none;letter-spacing:.5px;font-size:11px}
  .panel h2::before{content:"";width:8px;height:8px;background:var(--red);display:inline-block;flex:none}
  .panel .chartbox{position:relative;height:225px}
  #err{color:var(--red2);font-size:13px;margin-bottom:16px;display:none;background:rgba(215,25,33,.08);
    border:1px solid rgba(215,25,33,.3);border-radius:10px;padding:10px 14px}
  footer{margin-top:34px;color:#4A4A4A;font-size:11.5px;text-align:center;letter-spacing:.6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>D<span class="dot">'</span>S HEALTH<span class="dot">.</span></h1>
      <div class="sub">Nothing Watch · Live</div>
    </div>
    <div class="hstat">
      <div class="status" id="status"><span class="live">Connecting…</span></div>
      <button class="sync" id="sync">↻ Sync</button>
    </div>
  </header>

  <div id="err"></div>

  <div id="loading">
    <div class="big"><span class="pulse-dot"></span>FETCHING YOUR DATA</div>
    <div class="hint">Pulling the latest export from Google Drive</div>
    <div class="skel"><div></div><div></div><div></div><div></div><div></div></div>
  </div>

  <div id="dash" style="display:none">
    <div class="cards" id="cards"></div>
    <div class="panel insights">
      <h2><span class="ai-badge">AI</span> Daily insights <button class="regen" id="regen" title="Regenerate">↻</button></h2>
      <div id="insights" class="insights-body">Loading insights…</div>
    </div>
    <div class="toolbar">
      <div class="ranges" id="ranges">
        <button data-d="14">14D</button>
        <button data-d="30" class="active">30D</button>
        <button data-d="90">90D</button>
        <button data-d="9999">ALL</button>
      </div>
    </div>
    <div class="grid" id="chartGrid"></div>
  </div>

  <footer>AUTO-SYNCED FROM HEALTH CONNECT · PARSED IN YOUR BROWSER · NO SERVER STORAGE</footer>
</div>

<script>
/* ============ CONFIG ============ */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzzwQeftfgnfbe_Tg-oZBqHY8mOaTAALpchKx0g506gV1t7-0gcsZohZmJy3LAhTv35rQ/exec';
const SECRET = 'DharmHealthTrackAPI';
const GEMINI_API_KEY = 'AQ.Ab8RN6KqnKJrtRoabGG78TN-gbOuTVdJTEBYAkwTyMP3rVrSpA';
// Tried in order — first one that works is remembered for the session
const GEMINI_MODELS = ['gemini-3.5-flash','gemini-3-flash','gemini-3.1-flash-lite','gemini-2.5-flash'];
/* ---- Benchmarks (yellow lines) — tune to your goals ---- */
const BENCH = {
  steps: 8000,      // WHO: ~8k steps/day for adults (India avg is ~4-5k — you're aiming higher)
  rhr: 60,          // good-fitness resting HR for adult men
  sleep: 7,         // minimum recommended night sleep (7-9h)
  spo2: 95,         // healthy SpO2 floor
  cal: 400,         // active kcal/day ≈ WHO 150-300 min/wk moderate activity
  water: 3.0,       // ICMR-NIN: ~3L/day for adult men in Indian climate
  bmi: 22.5         // mid healthy BMI -> ideal weight uses your height
};
const YEL = '#FFD60A';
/* ================================ */

const $ = s => document.querySelector(s);
const MOBILE = matchMedia('(max-width:600px)').matches;
const EPOCH = new Date(1970,0,1);
const dayToDate = d => { const t = new Date(EPOCH); t.setDate(t.getDate()+d); return t; };
const fmt = d => d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
let DATA = null, range = 30, charts = {}, workingModel = null;

Chart.defaults.color = '#8C8C8C';
Chart.defaults.borderColor = '#272727';
Chart.defaults.font.family = "'Space Grotesk', sans-serif";

const store = {
  async get(k){ try{ return await window.storage.get(k); }catch(e){ const v=localStorage.getItem(k); return v?{value:v}:null; } },
  async set(k,v){ try{ await window.storage.set(k,v); }catch(e){ try{ localStorage.setItem(k,v); }catch(_){} } },
  async del(k){ try{ await window.storage.delete(k); }catch(e){ localStorage.removeItem(k); } }
};

function showErr(m){ const e=$('#err'); e.textContent=m; e.style.display='block'; }

/* ---------- Parse Health Connect DB ---------- */
async function parseDb(buf){
  const SQL = await initSqlJs({locateFile:f=>`https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${f}`});
  const db = new SQL.Database(new Uint8Array(buf));
  const q = sql => { try{ const r=db.exec(sql); return r.length?r[0].values:[]; }catch(e){ return []; } };

  const steps = q("SELECT local_date, SUM(count) FROM steps_record_table GROUP BY local_date ORDER BY local_date");
  const rhr   = q("SELECT local_date, ROUND(AVG(beats_per_minute),1) FROM resting_heart_rate_record_table GROUP BY local_date ORDER BY local_date");
  const spo2  = q("SELECT local_date, ROUND(AVG(percentage),1) FROM oxygen_saturation_record_table GROUP BY local_date ORDER BY local_date");

  let cal = q("SELECT local_date, SUM(energy) FROM active_calories_burned_record_table GROUP BY local_date ORDER BY local_date");
  if(cal.length){
    const avgv = cal.reduce((s,r)=>s+r[1],0)/cal.length;
    const div = avgv > 50000 ? 1000 : 1;
    cal = cal.map(([d,v])=>[d, Math.round(v/div)]);
  }

  const sleepRows = q("SELECT local_date, start_time, end_time FROM sleep_session_record_table ORDER BY start_time");
  const sleepByDay = {};
  for(const [ld, st, et] of sleepRows){
    const h = (et-st)/3600000;
    if(h >= 3) sleepByDay[ld] = Math.max(sleepByDay[ld]||0, h);
  }
  const sleep = Object.entries(sleepByDay).map(([k,v])=>[+k, +v.toFixed(1)]).sort((a,b)=>a[0]-b[0]);

  const stages = {Light:0, Deep:0, REM:0, Awake:0};
  const stageMap = {4:'Light',5:'Deep',6:'REM',1:'Awake',7:'Awake'};
  const cutoff = Date.now() - 30*86400000;
  for(const [t, st, et] of q("SELECT stage_type, stage_start_time, stage_end_time FROM sleep_stages_table")){
    if(et < cutoff) continue;
    const name = stageMap[t]; if(!name) continue;
    stages[name] += (et-st)/3600000;
  }

  const hrDaily = {};
  for(const [bpm, ms] of q("SELECT beats_per_minute, epoch_millis FROM heart_rate_record_series_table")){
    const d = Math.floor(ms/86400000);
    const o = hrDaily[d] || (hrDaily[d]={min:999,max:0,sum:0,n:0});
    if(bpm<o.min)o.min=bpm; if(bpm>o.max)o.max=bpm; o.sum+=bpm; o.n++;
  }
  const hr = Object.entries(hrDaily).map(([d,o])=>[+d, o.min, Math.round(o.sum/o.n), o.max]).sort((a,b)=>a[0]-b[0]);

  let hyd = q("SELECT local_date, SUM(volume) FROM hydration_record_table GROUP BY local_date ORDER BY local_date");
  if(hyd.length){
    const avgv = hyd.reduce((s,r)=>s+r[1],0)/hyd.length;
    const div = avgv > 100 ? 1000 : 1;
    hyd = hyd.map(([d,v])=>[d, +(v/div).toFixed(1)]);
  }

  const weight = q("SELECT local_date, ROUND(weight/1000.0,1) FROM weight_record_table GROUP BY local_date ORDER BY local_date");
  const hRow = q("SELECT height FROM height_record_table LIMIT 1");
  const heightM = hRow.length ? (hRow[0][0] > 3 ? hRow[0][0]/100 : hRow[0][0]) : null; // cm or m

  db.close();
  if(!steps.length && !rhr.length) throw new Error("No Health Connect data found in export.");
  return { steps, rhr, spo2, cal, sleep, stages, hr, hyd, weight, heightM, exported: Date.now() };
}

/* ---------- Fetch from Apps Script ---------- */
async function autoFetch(){
  const btn = $('#sync'); btn.disabled = true;
  try{
    $('#status').innerHTML = '<span class="live">Syncing…</span>';
    const res = await fetch(APPS_SCRIPT_URL + '?key=' + encodeURIComponent(SECRET));
    const j = await res.json();
    if(j.error) throw new Error(j.error);
    const bin = Uint8Array.from(atob(j.content), c=>c.charCodeAt(0));
    let buf = bin.buffer;
    if(j.isZip){
      const zip = await JSZip.loadAsync(buf);
      const dbFile = Object.values(zip.files).find(f=>f.name.endsWith('.db'));
      if(!dbFile) throw new Error('No .db inside the export zip');
      buf = await dbFile.async('arraybuffer');
    }
    DATA = await parseDb(buf);
    DATA.sourceUpdated = j.updated;
    await store.set('hc-data', JSON.stringify(DATA));
    render();
  }catch(e){
    if(DATA){ showErr('Sync failed ('+e.message+') — showing last saved data.'); render(); }
    else{
      $('#loading .big').innerHTML = 'CONNECTION FAILED';
      $('#loading .hint').textContent = e.message + ' — check Apps Script deployment & secret.';
    }
  }
  btn.disabled = false;
}

/* ---------- Render ---------- */
function slice(arr){
  if(!arr || !arr.length) return [];
  const maxDay = Math.max(...DATA.steps.map(r=>r[0]));
  return arr.filter(([d])=> d > maxDay - range);
}
function stat(label, target, unit, delta, decimals){
  return `<div class="card"><div class="label">${label}</div>
    <div class="value"><span class="num" data-t="${target}" data-dec="${decimals||0}">0</span><span class="unit">${unit}</span></div>
    ${delta?`<div class="delta ${delta.cls}">${delta.txt}</div>`:''}</div>`;
}
function countUp(){
  document.querySelectorAll('.num').forEach(el=>{
    const t = parseFloat(el.dataset.t)||0, dec = +el.dataset.dec, start = performance.now();
    const step = now => {
      const p = Math.min((now-start)/700, 1), eased = 1-Math.pow(1-p,3);
      el.textContent = (t*eased).toLocaleString(undefined,{minimumFractionDigits:dec,maximumFractionDigits:dec});
      if(p<1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

function render(){
  if(!DATA) return;
  $('#loading').style.display='none';
  $('#dash').style.display='block';
  const maxDay = Math.max(...DATA.steps.map(r=>r[0]));
  const src = DATA.sourceUpdated ? new Date(DATA.sourceUpdated) : new Date(DATA.exported);
  $('#status').innerHTML = `<span class="live">Live</span> · Data through <b>${fmt(dayToDate(maxDay))}</b><br>Export ${src.toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}`;

  const avg = a => a.length? a.reduce((s,r)=>s+ +r[1],0)/a.length : 0;
  const w = (a,n) => (a||[]).filter(([d])=>d>maxDay-n);
  const s14=w(DATA.steps,14), sPrev=(DATA.steps||[]).filter(([d])=>d<=maxDay-14&&d>maxDay-28);
  const stepDelta = sPrev.length? Math.round(avg(s14)-avg(sPrev)) : null;
  const lastFull = DATA.steps.length>1? DATA.steps[DATA.steps.length-2] : DATA.steps[DATA.steps.length-1];
  const r7=w(DATA.rhr,7), sl7=w(DATA.sleep,7), sp7=w(DATA.spo2,7), c7=w(DATA.cal,7), h7=w(DATA.hyd,7);

  let cards =
    stat('Latest full day', lastFull?lastFull[1]:0, 'steps',
      stepDelta!==null?{cls:stepDelta>=0?'up':'down',txt:(stepDelta>=0?'▲ +':'▼ ')+stepDelta.toLocaleString()+' vs prior 2wk'}:null) +
    stat('Resting HR · 7d', r7.length?+avg(r7).toFixed(0):0,'bpm',
      {cls:'',txt:'all-time '+avg(DATA.rhr).toFixed(0)+' bpm'}) +
    stat('Night sleep · 7d', sl7.length?+avg(sl7).toFixed(1):0,'h',
      {cls:avg(sl7)>=7?'up':'down',txt:avg(sl7)>=7?'On target':'Below 7h target'},1) +
    stat('SpO2 · 7d', sp7.length?+avg(sp7).toFixed(1):0,'%',null,1) +
    stat('Active burn · 7d', c7.length?Math.round(avg(c7)):0,'kcal/d',null);
  if(h7.length) cards += stat('Water · 7d', +avg(h7).toFixed(1),'L/d',null,1);
  $('#cards').innerHTML = cards;
  countUp();

  buildPanels();
  drawCharts();
  loadInsights();
}

function buildPanels(){
  let html = `
    <div class="panel"><h2>Steps / day <span class="target">— target ${BENCH.steps.toLocaleString()}</span></h2><div class="chartbox"><canvas id="cSteps"></canvas></div></div>
    <div class="panel"><h2>Resting heart rate <span class="target">— ideal ≤ ${BENCH.rhr}</span></h2><div class="chartbox"><canvas id="cRhr"></canvas></div></div>
    <div class="panel"><h2>Night sleep (hours) <span class="target">— min ${BENCH.sleep}h</span></h2><div class="chartbox"><canvas id="cSleep"></canvas></div></div>
    <div class="panel"><h2>Sleep stages · last 30d</h2><div class="chartbox"><canvas id="cStages"></canvas></div></div>
    <div class="panel"><h2>Heart rate range / day <span class="target">— resting ideal ${BENCH.rhr}</span></h2><div class="chartbox"><canvas id="cHr"></canvas></div></div>
    <div class="panel"><h2>Active calories <span class="target">— target ${BENCH.cal}</span></h2><div class="chartbox"><canvas id="cCal"></canvas></div></div>
    <div class="panel"><h2>Blood oxygen (SpO2) <span class="target">— healthy ≥ ${BENCH.spo2}%</span></h2><div class="chartbox"><canvas id="cSpo2"></canvas></div></div>`;
  if(DATA.hyd && DATA.hyd.length)
    html += `<div class="panel"><h2>Water intake (L) <span class="target">— target ${BENCH.water}L</span></h2><div class="chartbox"><canvas id="cHyd"></canvas></div></div>`;
  if(DATA.weight && DATA.weight.length > 1)
    html += `<div class="panel"><h2>Weight (kg) <span class="target">${DATA.heightM?`— ideal ~${(BENCH.bmi*DATA.heightM*DATA.heightM).toFixed(0)}kg`:''}</span></h2><div class="chartbox"><canvas id="cWeight"></canvas></div></div>`;
  $('#chartGrid').innerHTML = html;
}

function bench(n, v){
  return {type:'line', label:'Benchmark', data:Array(n).fill(v), borderColor:YEL,
    borderWidth:2, borderDash:[7,5], pointRadius:0, tension:0, fill:false, order:-1};
}

function grad(ctx, rgba){
  const g = ctx.createLinearGradient(0,0,0,225);
  g.addColorStop(0, rgba); g.addColorStop(1, 'rgba(0,0,0,0)');
  return g;
}

function drawCharts(){
  const mk = (id,cfg) => { const el=$(id); if(!el) return; if(charts[id]) charts[id].destroy(); charts[id]=new Chart(el,cfg); };
  const labels = a => a.map(([d])=>fmt(dayToDate(d)));
  const vals = a => a.map(r=>+r[1]);
  const st=slice(DATA.steps), rh=slice(DATA.rhr), sl=slice(DATA.sleep), sp=slice(DATA.spo2),
        ca=slice(DATA.cal), hrr=slice(DATA.hr), hy=slice(DATA.hyd), wt=slice(DATA.weight);
  const common = {responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:false},tooltip:{backgroundColor:'#1A1A1A',borderColor:'#333',borderWidth:1,padding:10,cornerRadius:8,
      filter:i=>i.dataset.label!=='Benchmark'}},
    scales:{x:{grid:{display:false},ticks:{maxTicksLimit:MOBILE?5:8,font:{size:MOBILE?9.5:11}}},y:{grid:{color:'#1B1B1B'},border:{display:false},ticks:{font:{size:MOBILE?9.5:11},maxTicksLimit:MOBILE?5:8}}},
    animation:{duration:600,easing:'easeOutQuart'}};

  mk('#cSteps',{type:'bar',data:{labels:labels(st),datasets:[
    {data:vals(st),backgroundColor:vals(st).map(v=>v>=BENCH.steps?'#D71921':'#EDEDED'),borderRadius:5,barPercentage:.68},
    bench(st.length, BENCH.steps)]},options:common});

  mk('#cRhr',{type:'line',data:{labels:labels(rh),datasets:[
    {data:vals(rh),borderColor:'#FF3B3B',pointBackgroundColor:'#FF3B3B',pointRadius:2.5,tension:.4,borderWidth:2.5,fill:true,
     backgroundColor:c=>grad(c.chart.ctx,'rgba(215,25,33,.18)')},
    bench(rh.length, BENCH.rhr)]},options:common});

  mk('#cSleep',{type:'bar',data:{labels:labels(sl),datasets:[
    {data:vals(sl),backgroundColor:vals(sl).map(v=>v>=BENCH.sleep?'#EDEDED':'#D71921'),borderRadius:5,barPercentage:.68},
    bench(sl.length, BENCH.sleep)]},
    options:{...common,scales:{...common.scales,y:{...common.scales.y,suggestedMax:9}}}});

  const sg = DATA.stages;
  mk('#cStages',{type:'doughnut',data:{labels:['Light','Deep','REM','Awake'],
    datasets:[{data:[sg.Light,sg.Deep,sg.REM,sg.Awake].map(v=>+v.toFixed(1)),
    backgroundColor:['#EDEDED','#D71921','#8C8C8C','#353535'],borderColor:'#161616',borderWidth:4,hoverOffset:6}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'66%',
      plugins:{legend:{display:true,position:MOBILE?'bottom':'right',labels:{boxWidth:10,padding:MOBILE?8:12,font:{size:MOBILE?10:11},
        generateLabels(c){const d=c.data;const tot=d.datasets[0].data.reduce((a,b)=>a+b,0)||1;
          return d.labels.map((l,i)=>({text:`${l} ${(d.datasets[0].data[i]/tot*100).toFixed(0)}%`,
            fillStyle:d.datasets[0].backgroundColor[i],strokeStyle:'transparent',index:i}));}}},
        tooltip:{callbacks:{label:c=>` ${c.label}: ${c.raw}h`}}}}});

  mk('#cHr',{type:'line',data:{labels:hrr.map(([d])=>fmt(dayToDate(d))),datasets:[
    {label:'Max',data:hrr.map(r=>r[3]),borderColor:'rgba(255,59,59,.9)',pointRadius:0,tension:.35,borderWidth:1.5,fill:'+2',backgroundColor:'rgba(215,25,33,.09)'},
    {label:'Avg',data:hrr.map(r=>r[2]),borderColor:'#EDEDED',pointRadius:0,tension:.35,borderWidth:2.5},
    {label:'Min',data:hrr.map(r=>r[1]),borderColor:'#555',pointRadius:0,tension:.35,borderWidth:1.5},
    bench(hrr.length, BENCH.rhr)]},
    options:{...common,plugins:{...common.plugins,legend:{display:true,labels:{boxWidth:10,usePointStyle:true,pointStyle:'line',font:{size:MOBILE?9.5:11}}}}}});

  mk('#cCal',{type:'bar',data:{labels:labels(ca),datasets:[
    {data:vals(ca),backgroundColor:vals(ca).map(v=>v>=BENCH.cal?'#D71921':'#EDEDED'),borderRadius:5,barPercentage:.68},
    bench(ca.length, BENCH.cal)]},options:common});

  mk('#cSpo2',{type:'line',data:{labels:labels(sp),datasets:[
    {data:vals(sp),borderColor:'#EDEDED',pointRadius:2,tension:.35,borderWidth:2.5,fill:true,
     backgroundColor:c=>grad(c.chart.ctx,'rgba(255,255,255,.08)')},
    bench(sp.length, BENCH.spo2)]},
    options:{...common,scales:{...common.scales,y:{...common.scales.y,suggestedMin:93,suggestedMax:100}}}});

  if(hy.length) mk('#cHyd',{type:'bar',data:{labels:labels(hy),datasets:[
    {data:vals(hy),backgroundColor:'#EDEDED',borderRadius:5,barPercentage:.68},
    bench(hy.length, BENCH.water)]},options:common});
  if(wt.length>1){
    const ds = [{data:vals(wt),borderColor:'#FF3B3B',pointRadius:2.5,tension:.35,borderWidth:2.5}];
    if(DATA.heightM) ds.push(bench(wt.length, +(BENCH.bmi*DATA.heightM*DATA.heightM).toFixed(1)));
    mk('#cWeight',{type:'line',data:{labels:labels(wt),datasets:ds},options:common});
  }
}

/* ---------- Gemini AI insights (latest models + fallback) ---------- */
function summaryForAI(){
  const maxDay = Math.max(...DATA.steps.map(r=>r[0]));
  const win = (a,n) => (a||[]).filter(([d])=>d>maxDay-n).map(r=>+r[1]);
  const avg = a => a.length? a.reduce((s,v)=>s+v,0)/a.length : null;
  const r1 = x => x==null? null : Math.round(x*10)/10;
  const sg = DATA.stages, tot = sg.Light+sg.Deep+sg.REM+sg.Awake || 1;
  return {
    period_end: dayToDate(maxDay).toDateString(),
    steps:{avg7:r1(avg(win(DATA.steps,7))), avg30:r1(avg(win(DATA.steps,30))), last7:win(DATA.steps,7)},
    resting_hr_bpm:{avg7:r1(avg(win(DATA.rhr,7))), avg30:r1(avg(win(DATA.rhr,30)))},
    night_sleep_hours:{avg7:r1(avg(win(DATA.sleep,7))), avg30:r1(avg(win(DATA.sleep,30))), last7:win(DATA.sleep,7)},
    sleep_stage_pct_30d:{light:r1(sg.Light/tot*100), deep:r1(sg.Deep/tot*100), rem:r1(sg.REM/tot*100)},
    active_kcal:{avg7:r1(avg(win(DATA.cal,7))), avg30:r1(avg(win(DATA.cal,30)))},
    spo2_pct:{avg7:r1(avg(win(DATA.spo2,7))), avg30:r1(avg(win(DATA.spo2,30)))},
    water_l: DATA.hyd && DATA.hyd.length ? {avg7:r1(avg(win(DATA.hyd,7)))} : 'not tracked'
  };
}

async function callGemini(prompt){
  const models = workingModel ? [workingModel, ...GEMINI_MODELS.filter(m=>m!==workingModel)] : GEMINI_MODELS;
  let lastErr = null;
  for(const model of models){
    try{
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${GEMINI_API_KEY}`,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({contents:[{parts:[{text:prompt}]}], generationConfig:{temperature:0.4, maxOutputTokens:350}})
      });
      const j = await res.json();
      if(j.error){
        // model not found / not supported -> try next; other errors (quota, key) -> stop
        if(res.status===404 || /not found|not supported/i.test(j.error.message||'')){ lastErr=j.error.message; continue; }
        throw new Error(j.error.message);
      }
      const text = (j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('').trim();
      if(!text){ lastErr='Empty response'; continue; }
      workingModel = model;
      return text;
    }catch(e){ lastErr = e.message; if(!/not found|not supported|Empty/i.test(e.message)) throw e; }
  }
  throw new Error(lastErr || 'All models failed');
}

async function loadInsights(force){
  const box = $('#insights');
  if(!GEMINI_API_KEY || GEMINI_API_KEY.indexOf('PASTE') === 0){
    box.textContent = 'Add your free Gemini API key in CONFIG to enable insights.';
    return;
  }
  const maxDay = Math.max(...DATA.steps.map(r=>r[0]));
  const cacheKey = 'hc-insights-' + maxDay;
  if(!force){
    try{ const c = await store.get(cacheKey); if(c && c.value){ box.innerHTML = c.value; return; } }catch(e){}
  }
  box.textContent = 'Analyzing your week…';
  const prompt = `You are a concise health coach. My wearable data summary (JSON): ${JSON.stringify(summaryForAI())}.
My targets: ${JSON.stringify(BENCH)} (steps/day, resting HR bpm, sleep h, SpO2 %, active kcal, water L, healthy BMI).
Give exactly 4 short insights comparing this week vs the 30-day baseline AND vs my targets (steps, sleep incl. stage quality, heart, activity/calories) and 1 specific actionable suggestion for tomorrow. Under 130 words total. Plain text, one line per point, each starting with "• ". No medical diagnoses.`;
  try{
    const text = await callGemini(prompt);
    const html = text.replace(/</g,'&lt;').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    box.innerHTML = html;
    await store.set(cacheKey, html);
  }catch(e){
    let msg = e.message;
    if(/OAuth|authentication credential/i.test(msg))
      msg = 'Invalid API key — Gemini keys start with "AIza". Get one free: aistudio.google.com → Get API key.';
    box.textContent = 'Insights unavailable: ' + msg;
  }
}

/* ---------- Events & boot ---------- */
$('#sync').addEventListener('click', autoFetch);
$('#regen').addEventListener('click', ()=>{ if(DATA) loadInsights(true); });
$('#ranges').addEventListener('click', e=>{
  if(e.target.dataset.d){
    range = +e.target.dataset.d;
    document.querySelectorAll('#ranges button').forEach(b=>b.classList.toggle('active', b===e.target));
    drawCharts();
  }
});

(async ()=>{
  try{
    const r = await store.get('hc-data');
    if(r && r.value){ DATA = JSON.parse(r.value); render(); }
  }catch(e){}
  autoFetch();
})();
